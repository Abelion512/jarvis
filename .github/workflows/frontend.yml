name: Frontend

on:
  workflow_call:
    inputs:
      commit:
        type: string
        default: ''

jobs:
  typecheck-and-build:
    name: tsc + vite build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: TypeScript typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Vite build
        run: npm run build
        working-directory: frontend
