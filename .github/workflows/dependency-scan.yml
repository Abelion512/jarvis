name: Dependency Scan

on:
  workflow_call:
    inputs:
      commit:
        type: string
        default: ''
      event_name:
        type: string
        default: 'push'

jobs:
  pip-audit:
    name: pip-audit
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ''

      - name: Install deps
        run: pip install --break-system-packages pip-audit -r requirements.txt

      - name: Run pip-audit
        run: pip-audit --format json > pip-audit-report.json || true

      - name: Report
        run: |
          python3 - <<'PY'
          import json, sys

          data = json.load(open("pip-audit-report.json")) if __import__("os").path.exists("pip-audit-report.json") else {"dependencies": []}
          vulns = [d for d in data.get("dependencies", []) if d.get("vulns")]
          if not vulns:
              print("✅ No known vulnerabilities")
              sys.exit(0)

          print(f"⚠️  {len(vulns)} vulnerabilities in {len(data.get('dependencies', []))} packages:")
          for v in vulns[:15]:
              for vuln in v.get("vulns", [])[:1]:
                  print(f"  - {v['name']} {v['version']}: {vuln.get('id', '?')} (fix: {vuln.get('fix_versions', ['?'])[0]})")
          print()
          # pip-audit's JSON records are {id, fix_versions, aliases,
          # description} with PYSEC-*/CVE-*/GHSA-* ids and no severity field,
          # so looking for "CRITICAL" inside an id never matched and every
          # vulnerable dependency passed this gate. Any vuln blocks; silence
          # one deliberately with --ignore-vuln <ID> on the step above.
          print(f"::error::{len(vulns)} package(s) with known vulnerabilities — update them, or waive one with --ignore-vuln <ID>")
          sys.exit(1)
          PY
