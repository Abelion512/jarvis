name: "✨ Feature Request"
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before submitting, please consider:

        - **Is this a new skill?** Most voice integrations belong in `skills/`. If it's a specialized service (Spotify, Notion, etc.), it should be a skill, not a core change.
        - **Search [existing issues](https://github.com/abelion/jarvis/issues)** — someone may have already proposed this.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve? What are you trying to do that you can't today?
      placeholder: |
        I'm trying to use JARVIS with [provider/service] but currently
        there's no way to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Be as specific as you can — CLI flags, config options, voice responses, dashboard behavior.
      placeholder: |
        Add a `/voice` command to `brain.py` that enables...
        Or: Add a config key `audio.input_device` that controls...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider? Why is the proposed solution better?

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      options:
        - New skill
        - Core agent behavior
        - Voice input / output (TTS, STT)
        - Dashboard / frontend
        - MCP tool
        - Run execution / Claude Code integration
        - Memory management
        - Security / permissions
        - Configuration / setup
        - Performance / reliability
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: How big is this change?
      options:
        - Small (single file, < 50 lines)
        - Medium (few files, < 300 lines)
        - Large (new module or significant refactor)

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself and submit a PR
